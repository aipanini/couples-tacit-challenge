<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情侣默契大挑战</title>
<style>
  :root{
    --pink:#ff8fb1; --pink-d:#ff6f9c;
    --purple:#a78bfa; --purple-d:#8b5cf6;
    --bg1:#ffe3ef; --bg2:#ece3ff; --bg3:#fff0f6;
    --card:#fff;
    --text:#4b3a52; --muted:#9b8aa5;
    --green:#34d399; --red:#fb7185; --pending:#e7dcef;
    --line:#f0d9e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(220px 220px at 12% 18%, rgba(255,143,177,.30), transparent 60%),
      radial-gradient(260px 260px at 88% 82%, rgba(167,139,250,.28), transparent 60%),
      linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    color:var(--text); padding:22px;
  }
  .card{
    width:100%; max-width:400px; background:var(--card);
    border-radius:26px; padding:30px 26px 28px;
    box-shadow:0 20px 60px rgba(196,120,170,.30), 0 2px 0 rgba(255,255,255,.6) inset;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120px 120px at 94% -10%, rgba(255,143,177,.16), transparent),
      radial-gradient(150px 150px at -12% 112%, rgba(167,139,250,.16), transparent);
  }
  .inner{position:relative; z-index:1;}
  .hero{display:flex; justify-content:center; margin-bottom:8px;}
  .hero svg{filter:drop-shadow(0 5px 10px rgba(255,111,156,.35)); animation:float 3.2s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  h1{font-size:21px; margin:0 0 6px; font-weight:750; letter-spacing:.5px; text-align:center;}
  .sub{font-size:13px; color:var(--muted); margin:0 0 20px; line-height:1.6; text-align:center;}
  .field{position:relative; margin-bottom:12px;}
  input[type=password],input[type=text]{
    width:100%; padding:13px 46px 13px 15px; font-size:16px;
    border:1.5px solid var(--line); border-radius:14px; outline:none;
    background:#fff7fb; color:var(--text);
    transition:border-color .2s, box-shadow .2s, background-color .2s;
  }
  input:focus{border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,143,177,.20); background:#fff;}
  input[type=password]::-ms-reveal,
  input[type=password]::-ms-clear{display:none;}
  input::-webkit-credentials-auto-fill-button,
  input::-webkit-strong-password-auto-fill-button{display:none !important;}
  .eye{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border:none; background:transparent; cursor:pointer;
    color:var(--muted); display:flex; align-items:center; justify-content:center; padding:0;
  }
  .eye:hover{color:var(--pink-d);}
  .eye svg{width:20px; height:20px;}
  .opts{display:flex; flex-direction:column; gap:9px; margin:4px 0 14px;}
  .opt{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); cursor:pointer; line-height:1.3;}
  .opt input{width:17px; height:17px; accent-color:var(--pink-d); flex-shrink:0; cursor:pointer;}
  .types{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; font-size:13px; color:var(--muted); margin-top:2px;}
  .types .lbl{color:var(--text); font-weight:550;}
  .tag{background:#fbe9f3; color:var(--pink-d); border-radius:999px; padding:3px 11px; font-size:12px; font-weight:550;}
  .tag-empty{background:transparent; color:var(--muted); padding-left:0;}
  .hint{font-size:12px; color:var(--muted); margin:2px 2px 16px; line-height:1.5;}
  .btn{
    position:relative; overflow:hidden;
    width:100%; padding:13px; font-size:15px; font-weight:650; color:#fff;
    border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    box-shadow:0 8px 20px rgba(255,111,156,.32);
    transition:transform .12s, box-shadow .2s;
  }
  .btn::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg); transition:left .55s;
  }
  .btn:hover{box-shadow:0 12px 28px rgba(255,111,156,.44);}
  .btn:hover::after{left:130%;}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:#fff; color:var(--pink-d); border:1.5px solid var(--line); box-shadow:none; margin-top:14px;}
  .btn.ghost:hover{background:#fff0f6; box-shadow:none;}
  .btn.ghost::after{display:none;}
  .dotrow{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 12px; min-height:14px; align-items:center;}
  .dot{width:14px; height:14px; border-radius:50%; background:var(--pending);
    transition:background-color .25s ease, transform .15s ease, box-shadow .25s ease;}
  .dot.match{background:var(--green); box-shadow:0 0 0 4px rgba(52,211,153,.16);}
  .dot.mismatch{background:var(--red); box-shadow:0 0 0 4px rgba(251,113,133,.16);}
  .cross{width:18px; height:18px; color:var(--red); display:inline-flex; align-items:center; justify-content:center;}
  .score{font-size:14px; font-weight:650; margin:2px 2px 8px; text-align:center;}
  .score .num{color:var(--pink-d);}
  .hintline{font-size:12px; color:var(--muted); margin:0 0 12px; line-height:1.5; text-align:center;
    background:#fbf3f9; border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .sharebox{margin-top:16px;}
  .linkcard{margin-top:12px; padding:11px 12px; border-radius:14px; border:1.5px solid var(--line); background:#fbf6fb;}
  .linkcard.link-answer{background:#fffaf0; border-color:#ffe2a8;}
  .link-label{font-size:12.5px; font-weight:650; margin-bottom:7px; color:var(--text);}
  .sharebox input{background:#fff; padding-right:15px; font-size:13px; margin-bottom:8px;}
  .copy{margin-top:2px;}
  .ans-banner{font-size:12px; font-weight:600; color:#7a5c00; background:#fff4d6; border:1px solid #ffe08a; border-radius:10px; padding:8px 10px; margin-bottom:12px; text-align:center;}
  .ans-reveal{font-size:14px; font-weight:600; color:var(--text); background:#f3ecff; border:1px solid #e3d5ff; border-radius:10px; padding:9px 12px; margin-bottom:12px; word-break:break-all;}
  .ans-reveal b{color:var(--purple-d); font-weight:750;}
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:rgba(75,58,82,.92); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:9;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .pulse{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .win{text-align:center; margin:6px 0 10px; display:none;}
  .win .heart{display:inline-block; color:var(--pink-d); animation:beat 1s ease-in-out infinite; margin-bottom:4px;}
  @keyframes beat{0%,100%{transform:scale(1);}25%{transform:scale(1.18);}40%{transform:scale(.94);}60%{transform:scale(1.12);}}
  .win .title{font-size:17px; font-weight:750; color:var(--pink-d);}
  .win .brag{display:block; font-weight:750; color:var(--pink-d); font-size:13.5px; margin-top:6px;
    background:linear-gradient(135deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .win small{display:block; font-weight:500; color:var(--muted); font-size:12px; margin-top:4px;}
</style>
</head>
<body>
<div class="card"><div class="inner" id="app"></div></div>
<div class="toast" id="toast"></div>
<script>
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1700);
  }

  /* ---------- 加密分享（纯客户端，无后端） ---------- */
  function hexToBytes(h){ const b=new Uint8Array(h.length/2); for(let i=0;i<b.length;i++) b[i]=parseInt(h.substr(i*2,2),16); return b; }
  function bytesToHex(b){ return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  function randomHex(n){ const a=new Uint8Array(n/2); crypto.getRandomValues(a); return bytesToHex(a); }
  function norm(ch, cs){ return cs ? ch : ch.toLowerCase(); }
  async function hmacPos(key, pos, ch, cs){
    const msg = new TextEncoder().encode(pos + ':' + norm(ch, cs));
    const ck = await crypto.subtle.importKey('raw', hexToBytes(key), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', ck, msg);
    return bytesToHex(new Uint8Array(sig));
  }
  function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(b64){ return decodeURIComponent(escape(atob(b64))); }
  function getPayload(key){
    const m = location.hash.match(new RegExp('(?:#|&)' + key + '=([^&]+)'));
    if(!m) return null;
    try{
      const p = JSON.parse(b64decode(m[1]));
      if(!p || !Array.isArray(p.h)) return null;
      if(p.v===1) return {v:1, len:p.len, k:p.k, h:p.h, showLen:p.showLen!==false, cs:!!p.cs, types:p.types||[]};
      if(p.v===2) return {v:2, len:p.n,   k:p.k, h:p.h, showLen:true,            cs:!!p.s, types:p.t||[]};
    }catch(e){}
    return null;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function getAnswer(){
    const m = location.hash.match(/#a=([^&]*)/);
    if(!m) return null;
    const pw = decodeURIComponent(m[1]);
    if(!pw) return null;
    const cs = /[?&]s=1/.test(location.hash);
    return {v:1, pw, cs, len:pw.length, types:detectTypes(pw)};
  }
  async function computeRes(g, p, realLen){
    const res = [];
    if(p.h && p.h.length){
      const hLen = p.h[0] ? p.h[0].length : 64;
      for(let i=0;i<realLen;i++){
        if(i<g.length) res.push((await hmacPos(p.k, i, g[i], p.cs)).slice(0, hLen) === p.h[i]);
        else res.push(null);
      }
    } else if(p.pw !== undefined){
      const T = p.cs ? p.pw : p.pw.toLowerCase();
      const G = p.cs ? g : g.toLowerCase();
      for(let i=0;i<realLen;i++) res.push(i<G.length ? (G[i] === T[i]) : null);
    }
    return res;
  }
  function detectTypes(s){
    const t=[];
    if(/[0-9]/.test(s)) t.push('数字');
    if(/[a-zA-Z]/.test(s)) t.push('字母');
    if(/[一-龥]/.test(s)) t.push('汉字');
    if(/[^0-9a-zA-Z一-龥\s]/.test(s)) t.push('特殊符号');
    return t;
  }

  const HEART_SVG = '<svg viewBox="0 0 24 24" width="34" height="34" fill="#ff6f9c"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
  const CROSS_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';

  /* ---------- 出题方 ---------- */
  function renderCreator(){
    app.innerHTML = `
      <div class="hero">${HEART_SVG}</div>
      <h1>设一个只有你们懂的暗号</h1>
      <p class="sub">输入一串只有你们俩懂的字符（纪念日、昵称、暗语都行），生成挑战链接发给 TA。</p>
      <div class="field">
        <input id="ans" type="password" placeholder="输入你的暗号" autocomplete="off" maxlength="32">
        <button class="eye" id="eye" type="button" aria-label="显示或隐藏">${EYE_OPEN}</button>
      </div>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="optCase"> 区分大小写</label>
      </div>
      <label class="opt"><input type="checkbox" id="optTypes"> 显示暗号包含的符号类型（数字、字母等）</label>
      <div class="types" id="typesPreview" style="display:none"></div>
      <button class="btn" id="gen">生成链接</button>
      <div class="sharebox" id="sharebox" style="display:none">
        <div class="linkcard link-challenge">
          <div class="link-label">🔒 挑战链接（不含答案 · 发给 TA）</div>
          <input id="linkC" type="text" readonly>
          <button class="btn copy" id="copyC">复制发给 TA</button>
        </div>
        <div class="linkcard link-answer">
          <div class="link-label">🔑 带答案链接（含答案 · 自己留着）</div>
          <input id="linkA" type="text" readonly>
          <button class="btn copy" id="copyA">复制自己留着</button>
        </div>
        <p class="hint" style="margin-top:10px">⚠️ 两条链接长得像，但带 🔑 的那条一打开就能看到答案——<b>千万别发给 TA</b>，否则挑战就没悬念了。</p>
      </div>`;
    const ans = document.getElementById('ans');
    const eye = document.getElementById('eye');
    const optTypes = document.getElementById('optTypes');
    const typesPreview = document.getElementById('typesPreview');
    function renderTypePreview(){
      if(!optTypes.checked){ typesPreview.style.display='none'; typesPreview.innerHTML=''; return; }
      const present = detectTypes(ans.value);
      typesPreview.style.display='flex';
      if(present.length===0){ typesPreview.innerHTML='<span class="tag-empty">还没输入，无法识别～</span>'; return; }
      typesPreview.innerHTML = '<span class="lbl">暗号包含：</span>' + present.map(t=>`<span class="tag">${t}</span>`).join('');
    }
    eye.addEventListener('click', ()=>{
      const show = ans.type === 'password';
      ans.type = show ? 'text' : 'password';
      eye.innerHTML = show ? EYE_OFF : EYE_OPEN;
      if(show) ans.focus();
    });
    ans.addEventListener('input', renderTypePreview);
    optTypes.addEventListener('change', renderTypePreview);
    renderTypePreview();
    document.getElementById('gen').addEventListener('click', async ()=>{
      const v = ans.value;
      if(!v){ toast('先输入你的暗号哦'); return; }
      const cs = document.getElementById('optCase').checked;
      const key = randomHex(16), h = [];
      for(let i=0;i<v.length;i++) h.push((await hmacPos(key, i, v[i], cs)).slice(0,16));
      const types = optTypes.checked ? detectTypes(v) : [];
      const payload = {v:2, n:v.length, k:key, h, s:cs?1:0, t:types};
      const urlC = location.origin + location.pathname + '#c=' + b64encode(JSON.stringify(payload));
      const urlA = location.origin + location.pathname + '#a=' + encodeURIComponent(v) + (cs ? '&s=1' : '');
      document.getElementById('linkC').value = urlC;
      document.getElementById('linkA').value = urlA;
      document.getElementById('sharebox').style.display = 'block';
      toast('两条链接已生成～');
    });
    document.getElementById('copyC').addEventListener('click', async ()=>{
      const link = document.getElementById('linkC').value;
      try{ await navigator.clipboard.writeText(link); toast('已复制，去发给 TA'); }
      catch(e){ const l=document.getElementById('linkC'); l.select(); document.execCommand('copy'); toast('已复制'); }
    });
    document.getElementById('copyA').addEventListener('click', async ()=>{
      const link = document.getElementById('linkA').value;
      try{ await navigator.clipboard.writeText(link); toast('已复制，自己留着'); }
      catch(e){ const l=document.getElementById('linkA'); l.select(); document.execCommand('copy'); toast('已复制'); }
    });
  }

  /* ---------- 作答 / 带答案 通用视图 ---------- */
  function renderGame(p, isAnswer){
    const realLen = (p.len !== undefined) ? p.len : (p.pw !== undefined ? p.pw.length : 0);
    const parts = [];
    parts.push(p.showLen===false ? '位数已隐藏' : `共 ${realLen} 位`);
    parts.push(p.cs ? '区分大小写' : '不区分大小写');
    if(p.types && p.types.length) parts.push('含：' + p.types.join('、'));
    const hintText = parts.join(' · ');
    const banner = isAnswer ? `<div class="ans-banner">🔑 这是带答案的链接 · 自己留着，别发给 TA</div>` : '';
    const reveal = isAnswer ? `<div class="ans-reveal">正确答案：<b>${escapeHtml(p.pw)}</b></div>` : '';
    app.innerHTML = `
      <div class="hero">${HEART_SVG}</div>
      <h1>${isAnswer ? '你的暗号（带答案）' : 'TA 设的暗号，你来猜'}</h1>
      <p class="sub">${isAnswer ? '这是你自己留存的答案链接，随时回来都能看。下面也能当小测验玩一玩。' : '输入你心里的那串字符，看看和 TA 有多少位一样。你的输入只有你能看到。'}</p>
      ${banner}
      <div class="field">
        <input id="guess" type="password" placeholder="输入你的猜测" autocomplete="off" maxlength="32">
        <button class="eye" id="eye" type="button" aria-label="显示或隐藏">${EYE_OPEN}</button>
      </div>
      ${reveal}
      <p class="hint">${isAnswer ? '点眼睛可以看你自己输了啥。' : '点眼睛可以看你自己输了啥；TA 的暗号你看不到，只能靠默契～'}</p>
      <div class="hintline">提示：${hintText}</div>
      <div class="dotrow" id="dots"></div>
      <div class="score" id="score"></div>
      <div class="win" id="win"></div>
      <button class="btn ghost" id="makeOwn" type="button">🎯 生成你自己的暗号挑战</button>`;
    const guess = document.getElementById('guess');
    const eye = document.getElementById('eye');
    const dots = document.getElementById('dots');
    const score = document.getElementById('score');
    const win = document.getElementById('win');
    eye.addEventListener('click', ()=>{
      const show = guess.type === 'password';
      guess.type = show ? 'text' : 'password';
      eye.innerHTML = show ? EYE_OFF : EYE_OPEN;
      if(show) guess.focus();
    });
    async function update(){
      const g = guess.value;
      const res = await computeRes(g, p, realLen);
      const DISPLAY = (p.showLen===false) ? 20 : realLen;
      dots.innerHTML = '';
      for(let i=0;i<DISPLAY;i++){
        const d = document.createElement('span'); d.className = 'dot';
        if(i < g.length){
          if(i < realLen) d.classList.add(res[i] ? 'match' : 'mismatch');
          else d.classList.add('mismatch');
        }
        dots.appendChild(d);
      }
      if(g.length > DISPLAY){ const c=document.createElement('span'); c.className='cross'; c.innerHTML=CROSS_SVG; dots.appendChild(c); }
      let matched = 0;
      for(let i=0;i<realLen;i++){ if(res[i]===true) matched++; }
      if(p.showLen){
        score.innerHTML = `一致性：<span class="num">${matched} / ${realLen}</span> 位（${realLen?Math.round(matched/realLen*100):0}%）`;
      } else {
        score.innerHTML = `已匹配 <span class="num">${matched}</span> 位`;
      }
      const winNow = realLen>0 && matched===realLen && g.length===realLen;
      if(winNow){
        win.style.display='block';
        win.innerHTML=`<div class="heart">${HEART_SVG}</div><div class="title">默契满分！你们真的懂彼此</div><span class="brag">🌟 超越了这个星球上 99% 的情侣</span><small>把链接甩回给 TA，看看 TA 能不能也猜中你</small>`;
        win.classList.add('pulse');
      } else { win.style.display='none'; win.classList.remove('pulse'); }
    }
    guess.addEventListener('input', update);
    const makeOwn = document.getElementById('makeOwn');
    if(makeOwn) makeOwn.addEventListener('click', ()=>renderCreator());
    update();
  }

  /* ---------- 启动 ---------- */
  if(!window.crypto || !crypto.subtle){
    app.innerHTML = '<h1>换个打开方式</h1><p class="sub">加密需要安全环境，请用 https 链接或 localhost 打开本页面。</p>';
  } else {
    const pA = getAnswer();
    const pC = getPayload('c');
    if(pA) renderGame(pA, true);
    else if(pC) renderGame(pC, false);
    else renderCreator();
  }
</script>
</body>
</html>
